version: '3'

networks:
  traefik-net:
    name: tylergilman_traefik
  backend:
    name: tylergilman_backend

volumes:
  traefik-certificates:
    name: tylergilman_certs
  prometheus_data:
    name: tylergilman_prometheus_data
  grafana_data:
    name: tylergilman_grafana_data

services:
  # Traefik reverse proxy
  traefik:
    image: traefik:v2.11
    container_name: tylergilman_traefik
    restart: unless-stopped
    networks:
      - traefik-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/letsencrypt
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/config:/etc/traefik/config:ro
    labels:
      - "traefik.enable=true"
      # Dashboard
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.tylergilman.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=leresolver"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth@file"
      # Prometheus metrics
      - "traefik.http.routers.traefik-metrics.rule=Host(`metrics.tylergilman.com`)"
      - "traefik.http.routers.traefik-metrics.entrypoints=websecure"
      - "traefik.http.routers.traefik-metrics.tls=true"
      - "traefik.http.routers.traefik-metrics.tls.certresolver=leresolver"
      - "traefik.http.routers.traefik-metrics.service=prometheus@internal"
      - "traefik.http.routers.traefik-metrics.middlewares=traefik-auth@file"

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tylergilman_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - traefik-net
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.tylergilman.com`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=leresolver"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=traefik-auth@file"

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: tylergilman_grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - traefik-net
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.tylergilman.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=leresolver"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # Application service - instance 1
  web1:
    image: tylergilman/tylergilman:prod
    container_name: tylergilman_web1
    user: "1001:1001"
    networks:
      - traefik-net
      - backend
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=tylergilman_prod"
      - "traefik.http.routers.tyler1.rule=Host(`tylergilman.com`)"
      - "traefik.http.routers.tyler1.entrypoints=websecure"
      - "traefik.http.routers.tyler1.tls=true"
      - "traefik.http.routers.tyler1.tls.certresolver=leresolver"
      - "traefik.http.services.tyler1.loadbalancer.server.port=8080"
      - "traefik.http.routers.tyler1.middlewares=security-headers@file"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - ENV=production
      - DEV_PORT=8080
      - DB_PATH=/app/data/blog.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      
  # Application service - instance 2
  web2:
    image: tylergilman/tylergilman:prod
    container_name: tylergilman_web2
    user: "1001:1001"
    networks:
      - traefik-net
      - backend
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=tylergilman_prod"
      - "traefik.http.routers.tyler2.rule=Host(`tylergilman.com`)"
      - "traefik.http.routers.tyler2.entrypoints=websecure" 
      - "traefik.http.routers.tyler2.tls=true"
      - "traefik.http.routers.tyler2.tls.certresolver=leresolver"
      - "traefik.http.services.tyler2.loadbalancer.server.port=8080"
      - "traefik.http.routers.tyler2.middlewares=security-headers@file"
    volumes:
      - ./data:/app/data:ro
      - ./.env:/app/.env:ro
    environment:
      - ENV=production
      - DEV_PORT=8080
      - DB_PATH=/app/data/blog.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Watchtower for automatic updates
  watchtower:
    image: containrrr/watchtower
    container_name: tylergilman_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --scope tylergilman_prod
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - TZ=America/Los_Angeles